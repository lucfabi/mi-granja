  /* ====== ANIMALES Y PLANTAS ====== */
  .sprite{position:absolute;transform:translate(-50%,-90%);border:0;background:none;padding:0;line-height:1;
          pointer-events:auto;filter:drop-shadow(0 .3cqw .2cqw rgba(0,0,0,.28))}
  .sprite .in{display:block}
  .animal{transform:translate(-50%,-100%)}
  .animal img{display:block;width:100%;height:auto;pointer-events:none;user-select:none}
  .planta{font-size:3cqw}
  .sprite:focus-visible{outline:.3cqw solid #1b6cff;border-radius:50%}

  .burbuja{position:absolute;transform:translate(-50%,-100%);z-index:9999;pointer-events:none;white-space:nowrap;
           background:#fff;border:.35cqw solid #4cb82f;border-radius:1.6cqw;padding:.2cqw 1.4cqw;
           font-weight:800;font-size:2.4cqw;animation:pop .25s both}
  @keyframes pop{from{transform:translate(-50%,-70%) scale(.5);opacity:0}}

  .chip{position:absolute;transform:translate(-50%,0);background:#fff6dc;border:.3cqw solid #d9983c;border-radius:2cqw;
        padding:0 1.2cqw;font-weight:800;font-size:2.2cqw;pointer-events:none}
  #vacio{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;
         background:#fff;border:.5cqw solid #4cb82f;border-radius:3cqw;padding:1cqw 3cqw;font-weight:800;font-size:3cqw;
         box-shadow:0 .6cqw 1.6cqw #0004}

  /* ====== BOTONES (mismo diseño que "Comprar" de la tienda) ====== */
  .btn{position:fixed;top:14px;z-index:30;border:3px solid #1d7a14;border-radius:16px;padding:6px 20px 8px;
       font-size:clamp(1rem,2vw,1.6rem);font-weight:800;color:#fff;white-space:nowrap;
       background:linear-gradient(#6fe047,#2a9a22);box-shadow:0 4px 0 #1b6a16,inset 0 2px 0 #a6f58a;
       -webkit-text-stroke:.14em #17630f;paint-order:stroke fill;text-shadow:0 2px 0 #17630f;
       transition:transform .15s,filter .15s}
  .btn:hover{transform:scale(1.06);filter:brightness(1.08)}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1b6a16,inset 0 2px 0 #a6f58a}
  .btn:focus-visible{outline:4px solid #1b6cff}
  #btnTienda{left:14px}
  #btnSalir{right:14px;border-color:#a82d0d;background:linear-gradient(#ff8a5a,#e0431c);
            box-shadow:0 4px 0 #9a2a0a,inset 0 2px 0 #ffc2a6;-webkit-text-stroke-color:#8c2508;text-shadow:0 2px 0 #8c2508}
  #btnSalir:active{box-shadow:0 1px 0 #9a2a0a,inset 0 2px 0 #ffc2a6}
</style>
</head>
<body>

<div id="stage" aria-label="Mi granja">
  <div class="capa" id="capaAnimales"></div>
  <div class="capa" id="capaPlantas"></div>
  <div class="capa" id="capaExtra"></div>
  <div id="vacio">¡Tu granja está vacía! Ve a la tienda 🛒</div>
</div>

<!-- ============ BOTONES ============
     Las direcciones se cambian en URL_TIENDA y URL_SALIR (en el script) -->
<button class="btn" id="btnTienda" onclick="ir(URL_TIENDA)">🛒 Ir a la tienda</button>
<button class="btn" id="btnSalir" onclick="ir(URL_SALIR)">🚪 Salir del juego</button>

">

<script>
/* =========================================================
   DIRECCIONES (aquí conectas con las otras páginas)
   ========================================================= */
const URL_TIENDA = "{% url 'tienda' %}";   // página de la tienda
const URL_SALIR  = "{% url 'index' %}";    // regresar al inicio
function ir(url){ if(url) window.location.href = url; }

/* =========================================================
   SISTEMA INTERACTIVO DE TAREAS DE PAPÁ
   ========================================================= */
const CLAVE_TAREAS_PAPA = 'granja_estado';
let tareaSeleccionadaId = null;

function obtenerTareasIniciales() {
  return [
    {
      id: 1,
      categoria: 'Hogar & Orden',
      titulo: 'Limpiar los juguetes del cuarto',
      detalle: 'Guarda los bloques de madera en la caja verde y ordena tus peluches.',
      monedas: 10,
      hecha: false,
      respuesta: ''
    },
    {
      id: 2,
      categoria: 'Lectura',
      titulo: 'Lectura de 20 minutos',
      detalle: 'Lee un capítulo de tu libro favorito y escribe abajo de qué trató.',
      monedas: 15,
      hecha: false,
      respuesta: ''
    },
    {
      id: 3,
      categoria: 'Matemáticas',
      titulo: 'Matemáticas: 10 + 3 Pollitos',
      detalle: 'Si tienes 10 pollitos amarillos y nacen 3 pollitos más, ¿cuántos pollitos hay en total?',
      monedas: 10,
      hecha: false,
      respuesta: ''
    }
  ];
}

function cargarTareasPapa() {
  const lista = document.getElementById('lista-tareas-granja');
  if (!lista) return;

  const estado = JSON.parse(localStorage.getItem(CLAVE_TAREAS_PAPA)) || {};
  if (!estado.tareas || estado.tareas.length === 0 || !estado.tareas[0].detalle) {
    estado.tareas = obtenerTareasIniciales();
    localStorage.setItem(CLAVE_TAREAS_PAPA, JSON.stringify(estado));
  }

  lista.innerHTML = estado.tareas.map(t => `
    <li onclick="abrirModalTarea(${t.id})" style="
      cursor: pointer;
      background: ${t.hecha ? '#EBF5E5' : '#FAF3E3'};
      border: 1.5px dashed ${t.hecha ? '#569E3D' : '#C8B291'};
      border-radius: 12px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      transition: transform 0.1s;
    " onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">
      <span style="
        text-decoration: ${t.hecha ? 'line-through' : 'none'};
        color: ${t.hecha ? '#4A8031' : '#4A3525'};
        font-weight: 700;
        line-height: 1.2;
      ">
        ${t.hecha ? '✅' : '👉'} ${t.titulo}
      </span>
      <span style="
        background: #FEF9EC;
        border: 1px solid #F3A41D;
        color: #B8780E;
        font-weight: 800;
        font-size: 12px;
        padding: 2px 6px;
        border-radius: 8px;
        white-space: nowrap;
      ">
        +${t.monedas} 🪙
      </span>
    </li>
  `).join('');
}

function abrirModalTarea(id) {
  const estado = JSON.parse(localStorage.getItem(CLAVE_TAREAS_PAPA)) || {};
  const tarea = (estado.tareas || []).find(t => Number(t.id) === Number(id));
  if (!tarea) return;

  tareaSeleccionadaId = tarea.id;
  document.getElementById('modal-tarea-cat').textContent = tarea.categoria || 'Misión de Papá';
  document.getElementById('modal-tarea-premio').textContent = `+${tarea.monedas} 🪙`;
  document.getElementById('modal-tarea-titulo').textContent = tarea.titulo;
  document.getElementById('modal-tarea-detalle').textContent = tarea.detalle || 'Completa esta misión y avísale a papá.';
  document.getElementById('modal-tarea-respuesta').value = tarea.respuesta || '';

  const btn = document.getElementById('btn-enviar-tarea');
  if (tarea.hecha) {
    btn.textContent = '⏳ Enviada a papá (Esperando monedas)';
    btn.style.background = '#E87A24';
    btn.style.borderColor = '#B35810';
    btn.style.boxShadow = '0 4px 0 #B35810';
  } else {
    btn.textContent = '✅ ¡Listo, ya la hice!';
    btn.style.background = '#569E3D';
    btn.style.borderColor = '#366B24';
    btn.style.boxShadow = '0 4px 0 #366B24';
  }

  document.getElementById('modal-tarea-nino').style.display = 'flex';
}

function cerrarModalTarea() {
  document.getElementById('modal-tarea-nino').style.display = 'none';
  tareaSeleccionadaId = null;
}

function completarTareaActual() {
  if (!tareaSeleccionadaId) return;
  const estado = JSON.parse(localStorage.getItem(CLAVE_TAREAS_PAPA)) || {};
  const idx = (estado.tareas || []).findIndex(t => Number(t.id) === Number(tareaSeleccionadaId));
  if (idx !== -1) {
    estado.tareas[idx].hecha = true;
    estado.tareas[idx].respuesta = document.getElementById('modal-tarea-respuesta').value.trim();
    localStorage.setItem(CLAVE_TAREAS_PAPA, JSON.stringify(estado));
  }
  cerrarModalTarea();
  cargarTareasPapa();
}

document.addEventListener('DOMContentLoaded', cargarTareasPapa);

}
function escribir(s){
  memoria = s;
  try{ localStorage.setItem(CLAVE, JSON.stringify(s)); }catch(e){}
}

/* =========================================================
   DIBUJAR LA GRANJA
   ========================================================= */
const $ = id => document.getElementById(id);
function sprite(clase, contenido, x, y, texto, f, ancho){
  const est = ancho ? `;width:${ancho}cqw` : '';
  return `<button class="sprite ${clase}" aria-label="${texto}" data-s="${texto}" data-x="${x}" data-y="${y}" data-f="${f}"
            style="left:${pct(x,W)};top:${pct(y,H)};z-index:${Math.round(y)}${est}"><span class="in">${contenido}</span></button>`;
}
let ultimo = '';
function render(){
  const inv = leer().inv || {};
  const firma = JSON.stringify(inv);
  if(firma === ultimo) return;           // nada cambió
  ultimo = firma;

  // Animales
  let htmlA = '', total = 0, k = 0;
  CORRALES.forEach(c => {
    const lista = [];
    c.t.forEach(id => { const n = Math.min(inv[id] || 0, MAX_POR_TIPO); for(let i=0;i<n;i++) lista.push(id); });
    const L = lista.slice(0, MAX_POR_CORRAL);
    L.forEach((id, i) => {
      const x = c.r.x + (i + 0.5) / L.length * c.r.w;
      const y = c.r.y + (i % 2) * c.r.h;
      const a = ANIMALES[id];
      htmlA += sprite('animal', `<img src="${a.i}" alt="${a.n}" draggable="false">`, Math.round(x), Math.round(y), a.s, a.f, (a.w*1.25).toFixed(2));
      total++;
    });
  });
  $('capaAnimales').innerHTML = htmlA;

  // Plantas (semillas compradas)
  const semillas = inv.semillas || 0;
  let htmlP = '';
  for(let i=0; i<Math.min(semillas, MAX_PLANTAS); i++){
    const fila = Math.floor(i / 10), col = i % 10;
    const x = 410 + col*93 + (fila%2)*22, y = SURCOS_Y[fila] + 14;
    htmlP += sprite('planta', '🌱', x, y, '¡Crece, crece! 🌱', 800, null);
  }
  $('capaPlantas').innerHTML = htmlP;
  total += Math.min(semillas, MAX_PLANTAS);

  // Contador de plantas junto al letrero
  $('capaExtra').innerHTML = semillas > 0
    ? `<div class="chip" style="left:${pct(147,W)};top:${pct(782,H)}">🌱 × ${semillas}</div>` : '';
  $('vacio').style.display = total ? 'none' : 'block';
}

/* =========================================================
   INTERACCIÓN: tocar un animal o una planta
   ========================================================= */
let ctx;
function beep(f){
  try{
    ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(f, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(f*1.4, ctx.currentTime + .12);
    g.gain.setValueAtTime(.2, ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .2);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + .22);
  }catch(e){}
}
let tb;
$('stage').addEventListener('click', e => {
  const b = e.target.closest('.sprite'); if(!b) return;
  $('capaExtra').querySelectorAll('.burbuja').forEach(x => x.remove());
  $('capaExtra').insertAdjacentHTML('beforeend',
    `<div class="burbuja" style="left:${pct(+b.dataset.x,W)};top:${pct(+b.dataset.y-70,H)}">${b.dataset.s}</div>`);
  clearTimeout(tb); tb = setTimeout(() => $('capaExtra').querySelectorAll('.burbuja').forEach(x => x.remove()), 1600);
  beep(+b.dataset.f);
});

/* =========================================================
   ACTUALIZACIÓN AUTOMÁTICA
   Cada segundo revisa si la tienda o padres guardaron algo nuevo
   ========================================================= */
render();
setInterval(() => {
  render();
  cargarTareasPapa();
}, 800);
window.addEventListener('pageshow', () => {
  render();
  cargarTareasPapa();
});
window.addEventListener('storage', () => {
  render();
  cargarTareasPapa();
});

cargarTareasPapa();
</script>
