{% load static %}
<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wealth Roots - Inicio</title>

  <link rel="stylesheet" href="{% static 'main.css' %}">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&amp;family=Nunito:wght@700;800;900&amp;display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Fredoka', 'Nunito', cursive, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    @keyframes playful-float-pulse {
      0%, 100% {
        transform: translateY(0px) rotate(0deg) scale(1);
        filter: drop-shadow(0 10px 25px rgba(245, 158, 11, 0.45));
      }
      35% {
        transform: translateY(-7px) rotate(-1deg) scale(1.025);
        filter: drop-shadow(0 18px 35px rgba(251, 191, 36, 0.7));
      }
      70% {
        transform: translateY(3px) rotate(1deg) scale(1.01);
        filter: drop-shadow(0 12px 28px rgba(245, 158, 11, 0.55));
      }
    }

    .play-btn-anim {
      animation: playful-float-pulse 3.2s ease-in-out infinite !important;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .play-btn-anim:hover {
      animation-play-state: paused !important;
      transform: scale(1.08) translateY(-4px) !important;
      filter: drop-shadow(0 20px 40px rgba(245, 158, 11, 0.85)) !important;
    }

    .play-btn-anim:active {
      transform: scale(0.95) translateY(2px) !important;
    }
  </style>
</head>

<body class="h-full w-full m-0 p-0 overflow-hidden relative bg-[#2d4a22] flex flex-col justify-between">

  <!-- FONDO -->
  <div class="absolute inset-0 z-0 overflow-hidden">
    <img
      src="https://lh3.googleusercontent.com/aida-public/AB6AXuC-nUDHPIpZDUikIMlBQknIKKx9r2ahCFrKEaiT_YV3W__C-silokQKwNtvL9lqQssRsus5MIwT8tzvfPq4nEmGFqGt6aZrXyZoOXhvpRt0tu8m7cSJAlEQKcOSeNg3kVizrGkh-D7MQdwDeRNKqYgHfPnslpug_F-TgcdgAw0ixm3Gehe_kU1XiWfQWlRZyOaFsZup_V_FTl-H7e_SVFnPKoWeNOErKbvox3UJD6k97NVNKBWivb6u"
      alt="Fondo Granja Financiera"
      class="w-full h-full object-cover object-center"
      style="filter: brightness(1.05) saturate(1.08);">
  </div>

  <!-- ENCABEZADO -->
  <header class="relative z-10 w-full px-4 sm:px-8 pt-4 sm:pt-6 pb-2 flex items-start justify-between">

    <!-- LOGO -->
    <div class="flex items-center select-none transition-transform duration-200 hover:scale-105 cursor-pointer">
      <div class="flex items-center gap-3 bg-white/95 px-4 py-2 sm:px-5 sm:py-2.5 rounded-2xl sm:rounded-full shadow-lg border-2 border-emerald-100 backdrop-blur-sm">

        <img
          src="https://lh3.googleusercontent.com/aida-public/AB6AXuAwdWyqzl1BcwrKXqa8H5uXbTceiFPbIbdtD-WCtAw1DOgtMrMmvqPBz7tG2h3rDdKxOqWrZQODsA01TDTercu0ZksBuSvhUvcTkh8vZ3tl3g06ZRfjz8ma7RmvGCIJjDjHdoHbu1CLmL6XGYv-nkCnjHUhma276-oOJ9u7bq7aJp2LUiJow0UO0y9FBBEs2F3dp5xF7jEU2FLtNcmY_n4pZMnUBA-xCgCoLfDv8SshI6mVQ6BdS1dg"
          alt="Wealth Roots Logo"
          class="w-10 h-10 sm:w-12 sm:h-12 object-contain drop-shadow-sm">

        <span class="font-black text-xl sm:text-2xl tracking-wide uppercase text-[#15803d] flex items-center gap-1.5" style="font-family: 'Fredoka', 'Nunito', sans-serif;">
          WEALTH <span class="text-[#22c55e]">ROOTS</span>
        </span>

      </div>
    </div>

    <!-- ACCESO PARA PADRES (VA A acceso.html) -->
    <div class="flex items-center">
      <a
        href="{% url 'acceso' %}"
        id="parentsAccessBtn"
        class="group flex items-center gap-3 active:scale-95 px-6 py-3 sm:px-7 sm:py-3.5 rounded-full shadow-xl transition-all duration-200 cursor-pointer hover:scale-105"
        title="Área de gestión para padres y tutores"
        style="background: linear-gradient(135deg, rgb(163, 230, 53) 0%, rgb(101, 163, 13) 100%); border: 3px solid rgb(254, 240, 138); box-shadow: rgba(0, 0, 0, 0.35) 0px 8px 24px, rgb(63, 98, 18) 0px 3px 0px, rgba(255, 255, 255, 0.6) 0px 2px 0px inset;">

        <span class="w-8 h-8 rounded-full flex items-center justify-center text-[#1e3a1e]"
          style="background-color: rgba(255, 255, 255, 0.45); box-shadow: inset 0 1px 2px rgba(0,0,0,0.15);">

          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"></path>
          </svg>

        </span>

        <span class="font-extrabold text-base sm:text-lg tracking-wide text-[#14320b] select-none"
          style="text-shadow: 0 1px 0 rgba(255, 255, 255, 0.7);">
          Acceso para padres
        </span>
      </a>
    </div>

  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="relative z-10 flex-1 flex flex-col items-center justify-center px-4 -mt-4 sm:-mt-2">
    <div class="relative flex flex-col items-center">

      <!-- TITULO -->
      <div class="mb-4 sm:mb-6 text-center select-none">
        <h1
          class="font-black tracking-wider uppercase text-[#fef08a] leading-[1.05] drop-shadow-[0_12px_24px_rgba(0,0,0,0.75)] select-none"
          style="font-family: Fredoka, Nunito, cursive, sans-serif; font-size: clamp(3.2rem, 9vw, 5.5rem); -webkit-text-stroke: 1.75px rgb(56, 21, 4); paint-order: stroke; text-shadow: rgb(40, 14, 3) 0px 2.5px 0px, rgba(0, 0, 0, 0.6) 0px 10px 20px, rgba(0, 0, 0, 0.8) 0px 2px 4px;">
          Wealth <br>Roots
        </h1>
      </div>

      <!-- BOTON PLAY (VA A granja.html) -->
      <a
        href="{% url 'granja' %}"
        id="playGameBtn"
        aria-label="Comenzar Aventura"
        class="play-btn-anim relative group focus:outline-none flex items-center justify-center cursor-pointer"
        style="margin-top: 40px;">

        <div class="relative flex items-center justify-center transition-transform duration-300 hover:scale-105 active:scale-95">
          <img
            src="https://lh3.googleusercontent.com/aida-public/AB6AXuBGBMTcnpN2qtcKMtdUqISlHzFVX8YZs-qZGKD7T2tlSPrF53SkzHPUB6wHpexR6I0DyTHwv-0X-6dPoQ7IX7-ynP0ju8AOkfBXzy9_9re9WjGekLHvC-xLjTu_K9zO2z_60oypy42kbpzo-nDQu-Tc3h77suQcEisYBQhLIGvKhQ71SsPn2-SbHAbUIMFlaCV4iyCWHNhhmLgzpNt-U0wuCgrzhQYb-Bnr1biunKvxu9GBGsMQKqbv"
            alt="Jugar Wealth Roots"
            class="w-[330px] sm:w-[410px] md:w-[475px] max-w-[90vw] h-auto object-contain select-none pointer-events-none drop-shadow-[0_15px_30px_rgba(0,0,0,0.6)] filter transition-all duration-300 group-hover:brightness-105"
            style="filter: drop-shadow(rgba(0, 0, 0, 0.55) 0px 12px 28px) drop-shadow(rgba(234, 179, 8, 0.45) 0px 0px 25px);">
        </div>
      </a>

    </div>
  </main>

  <!-- PIE DE PAGINA -->
  <footer class="relative z-10 w-full py-3 px-4 text-center">
    <div class="inline-flex items-center gap-2 font-bold text-[#fef9c3] backdrop-blur-sm"
      style="background: rgba(20, 45, 18, 0.65); padding: 8px 24px; border-radius: 9999px; text-shadow: rgba(0, 0, 0, 0.8) 0px 2px 4px; box-shadow: rgba(0, 0, 0, 0.4) 0px 6px 16px; border: 1.5px solid rgba(254, 249, 195, 0.45);">
      <span style="font-size: 0.95rem; letter-spacing: 0.025em;">
        Videojuego educativo infantil
      </span>
    </div>
  </footer>

</body>
</html>
