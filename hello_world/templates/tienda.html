                 background:radial-gradient(ellipse 42% 16% at 50% 88%,#6cc943 99%,transparent 100%)}
  .semillas .precio{display:flex;align-items:center;gap:.7cqw;background:#f8e6b4;border-radius:2cqw;padding:.2cqw 2.4cqw .2cqw .3cqw;font-weight:800;font-size:2.1cqw}

  /* ====== BOTONES FLOTANTES: volver y corral ====== */

  @keyframes sube{to{transform:translateY(-12cqw) scale(1.6);opacity:0}}
  @keyframes cae{to{transform:translateY(115cqw) rotate(360deg);opacity:.9}}
  @keyframes shake{25%{transform:translateX(-.8cqw)}75%{transform:translateX(.8cqw)}}
  @media (prefers-reduced-motion:reduce){.vuela,.cae{animation-duration:.01s}}

<body>

<!-- ============ ESCENARIO ============ -->
<div id="stage" aria-label="Tienda de la granja">
  <!-- se llenan con JavaScript: botones de comprar, parches, etc. -->
</div>

<!-- ============ MI CORRAL (aquí se vende) ============ -->
<section id="corral">
  <h2>🏡 Mi corral <button id="reset" onclick="reiniciar()">🔄 Empezar de nuevo</button></h2>
  <p>Aquí están tus animales y semillas. ¡Puedes venderlos para ganar monedas!</p>
  <div id="lista"></div>
</section>

<!-- ============ BOTÓN VOLVER ============
     Para conectarlo con otra página, escribe la dirección en URL_VOLVER (en el script, al final) -->
<button id="volverBtn" onclick="volver()" aria-label="Volver">⬅ Volver</button>
<button id="corralBtn" onclick="irCorral()" aria-label="Ir a mi corral">🏡 Mi corral ⬇</button>

<!-- ============ MÚSICA ============
     Aquí irá la música de fondo. Para agregarla, escribe la ruta del archivo
     en MUSICA_SRC (en el script, al final), por ejemplo: 'musica/granja.mp3' -->
<audio id="musica" loop preload="none"></audio>
<!-- <button id="musicaBtn" onclick="alternarMusica()" aria-label="Música">🎵 Música</button> -->
<div id="toast" role="status" aria-live="polite"></div>

<!-- ============ VENTANA DE LOGROS ============ -->
<div id="modal" onclick="if(event.target===this)cerrar()">
  <div class="box">
    <h2>🏆 Mis Logros <span id="modalCuenta"></span></h2>
    <div id="grid"></div>
    <button id="cerrar" onclick="cerrar()">¡Listo!</button>
  </div>
</div>

<script>
/* =========================================================
   DATOS (aquí puedes cambiar precios, nombres o logros)
   ========================================================= */
const W = 1625, H = 968;               // tamaño de la imagen original
const pct = (v, t) => (v / t * 100) + '%';

// x, y = posición del botón "Comprar" dentro de la imagen
const ANIMALES = [
  {id:'gallina', n:'Gallina', e:'🐔', p:200, x:660,  y:472},
  {id:'pollito', n:'Pollito', e:'🐥', p:150, x:910,  y:472},
  {id:'cerdo',   n:'Cerdo',   e:'🐷', p:250, x:1160, y:472},
  {id:'pato',    n:'Pato',    e:'🦆', p:180, x:1410, y:472},
  {id:'caballo', n:'Caballo', e:'🐴', p:300, x:660,  y:820},
  {id:'oveja',   n:'Oveja',   e:'🐑', p:280, x:910,  y:820},
  {id:'cabra',   n:'Cabra',   e:'🐐', p:260, x:1160, y:820},
  {id:'semillas', n:'Semillas', e:'🌱', p:40, x:1410, y:820},
];
const precioVenta = a => Math.round(a.p * 0.8);   // al vender te dan el 80 %

const LOGROS = [
  {id:'l1',  e:'🐔', n:'¡Llegué a la granja!', d:'Empezar a jugar',            ok:s=>true},
  {id:'l2',  e:'🌱', n:'Ahorrador',            d:'Tener 500 monedas',          ok:s=>s.monedas>=500},
  {id:'l3',  e:'🏠', n:'Granjero',             d:'Comprar 3 animales',         ok:s=>s.comprados>=3},
  {id:'l4',  e:'🐣', n:'Primer animal',        d:'Comprar tu primer animal',   ok:s=>s.comprados>=1},
  {id:'l5',  e:'🐷', n:'Granja variada',       d:'Tener 4 animales distintos', ok:s=>distintos(s)>=4},
  {id:'l6',  e:'💰', n:'Vendedor',             d:'Vender un animal',           ok:s=>s.vendidos>=1},
  {id:'l7',  e:'🌟', n:'¡Rico!',               d:'Tener 1000 monedas',         ok:s=>s.monedas>=1000},
  {id:'l8',  e:'🐴', n:'Amigo del caballo',    d:'Comprar el caballo',         ok:s=>(s.inv.caballo||0)>0 || s.compro.caballo},
  {id:'l9',  e:'🐑', n:'Gran rebaño',          d:'Tener 5 cosas en el corral',           ok:s=>total(s)>=5},
  {id:'l10', e:'🏆', n:'Granja completa',      d:'Tener todo lo de la tienda',       ok:s=>distintos(s)>=8},
];
// Los 3 círculos que se ven en la imagen (centro x, centro y)
const BADGES = [[152,720],[263,720],[371,720]];

/* =========================================================
   ESTADO DEL JUEGO
   ========================================================= */
const nuevo = () => ({monedas:750, nivel:5, xp:120, inv:{}, compro:{}, comprados:0, vendidos:0, logros:['l1','l2']});
let S = nuevo();
// Guardado compartido con la granja (granja.html lee esta misma clave)
const CLAVE = 'granja_estado';
try{
  let t = null; try{ t = localStorage.getItem(CLAVE); }catch(e){}
  if(!t && window.name.indexOf(CLAVE + ':') === 0) t = window.name.slice(CLAVE.length + 1);   // respaldo
  const g = JSON.parse(t); if(g && g.inv) S = Object.assign(nuevo(), g);
}catch(e){}
function guardar(){
  const t = JSON.stringify(S);
  try{ localStorage.setItem(CLAVE, t); }catch(e){}
  window.name = CLAVE + ':' + t;   // respaldo para navegadores que no comparten localStorage entre archivos
}
const total = s => Object.values(s.inv).reduce((a,b)=>a+b,0);
const distintos = s => Object.values(s.inv).filter(n=>n>0).length;
const xpMax = () => S.nivel * 40;

/* =========================================================
   CONSTRUIR LA PANTALLA
   ========================================================= */
const stage = document.getElementById('stage');
function pieza(html){ stage.insertAdjacentHTML('beforeend', html); }
function caja(l,t,w,h){ return `left:${pct(l,W)};top:${pct(t,H)};width:${pct(w,W)};height:${pct(h,H)}`; }

// Botones "Comprar"
ANIMALES.forEach(a=>{
  pieza(`<button class="hot" id="b_${a.id}" style="${caja(a.x-83,a.y,166,50)}"
          aria-label="Comprar ${a.n} por ${a.p} monedas" onclick="comprar('${a.id}')"></button>`);
});
// Tarjeta de Semillas: cubre el conejo dibujado en la imagen
pieza(`<svg class="z tarSem" viewBox="0 0 206 237" preserveAspectRatio="none" aria-hidden="true" style="${caja(1304,580,206,237)}">
  <defs><linearGradient id="pnSem" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#feeecb"/><stop offset="1" stop-color="#fdebc4"/></linearGradient></defs>
  <path d="M0 198V19Q0 3 16 3H190Q206 3 206 19V198Z" fill="url(#pnSem)"/>
  <rect y="198" width="206" height="39" fill="#fdde7d"/>
  <text x="103" y="37" text-anchor="middle" font-family="'Baloo 2','Comic Sans MS',sans-serif" font-weight="800" font-size="31" fill="#6a3410">Semillas</text>
  <ellipse cx="103" cy="172" rx="78" ry="16" fill="#79c83a"/><ellipse cx="103" cy="170" rx="66" ry="11" fill="#8fdc4a"/>
  <path d="M32 168l-3-14 9 9zM176 166l4-13-10 8zM60 160l-2-10 8 7z" fill="#6cc03a"/>
  <path d="M50 172C38 146 44 118 62 104H94C112 118 118 146 106 172Z" fill="#e9b768" stroke="#c4863a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M60 104C58 92 64 84 70 80H86C92 84 98 92 96 104Z" fill="#efc27a" stroke="#c4863a" stroke-width="3" stroke-linejoin="round"/>
  <rect x="56" y="99" width="44" height="8" rx="4" fill="#b9732c"/>
  <ellipse cx="78" cy="140" rx="11" ry="15" fill="#fff6dc" stroke="#c4863a" stroke-width="2"/>
  <path d="M78 150V138" stroke="#4aa82e" stroke-width="3" stroke-linecap="round"/>
  <path d="M78 140C70 140 68 134 68 131C74 131 78 134 78 140Z" fill="#6cc943"/><path d="M78 138C80 132 85 130 89 131C88 136 84 139 78 138Z" fill="#8fe05a"/>
  <g fill="#8a5a2b"><ellipse cx="116" cy="170" rx="5" ry="3" transform="rotate(-20 116 170)"/><ellipse cx="124" cy="175" rx="5" ry="3"/><ellipse cx="110" cy="176" rx="4.5" ry="2.8" transform="rotate(15 110 176)"/></g>
  <ellipse cx="150" cy="170" rx="22" ry="8" fill="#8b5a2b"/>
  <path d="M150 168C150 150 150 138 150 124" stroke="#3f9c1f" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M150 134C136 135 126 126 124 114C139 113 148 120 150 134Z" fill="#7bd04a" stroke="#3f9c1f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M150 126C157 111 171 107 180 109C178 122 165 130 150 126Z" fill="#92e25c" stroke="#3f9c1f" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="36" y="198" width="150" height="34" rx="17" fill="#fcd377"/>
  <circle cx="55" cy="215" r="18" fill="#f7b91c" stroke="#e0900a" stroke-width="3"/><circle cx="55" cy="215" r="12" fill="none" stroke="#fde27a" stroke-width="2"/>
  <text x="55" y="222" text-anchor="middle" font-family="'Baloo 2','Comic Sans MS',sans-serif" font-weight="800" font-size="20" fill="#fff">$</text>
  <text x="122" y="226" text-anchor="middle" font-family="'Baloo 2','Comic Sans MS',sans-serif" font-weight="800" font-size="30" fill="#6a3410">40</text>
  </svg>`);
// Monedas, nivel, XP y logros (cubren los números de la imagen)
pieza(`<div id="coins" class="z patch" style="${caja(1472,32,100,52)}">0</div>`);
pieza(`<svg class="z estrellaNivel" viewBox="0 0 130 103" preserveAspectRatio="none" aria-hidden="true" style="overflow:visible;${caja(195,355,130,103)}">
  <rect width="130" height="103" fill="#fdedcc"/>
  <defs><linearGradient id="gEst" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffec55"/><stop offset="1" stop-color="#ffcf12"/></linearGradient></defs>
  <polygon points="65,5 80.87,35.16 114.45,40.93 90.68,65.34 95.56,99.07 65,84 34.44,99.07 39.32,65.34 15.55,40.93 49.13,35.16"
           fill="url(#gEst)" stroke="#ec9a1c" stroke-width="8" stroke-linejoin="round"/>
  <path d="M44 30C52 21 60 16 66 14" stroke="#fff" stroke-opacity=".55" stroke-width="5" stroke-linecap="round" fill="none"/>
  <text id="lvl" x="65" y="71" text-anchor="middle" font-family="'Baloo 2','Comic Sans MS',sans-serif" font-weight="800" font-size="46" fill="#6a3410">5</text>
</svg>`);
pieza(`<div class="z bar" style="${caja(110,460,297,36)}"><i id="xpFill"></i></div>`);
pieza(`<div id="xpTxt" class="z patch" style="${caja(165,500,190,32)}"></div>`);
pieza(`<div id="logTxt" class="z patch" style="${caja(230,598,105,32)}"></div>`);
pieza(`<div class="z bar" style="${caja(137,634,256,28)}"><i id="logFill"></i></div>`);
pieza(`<div id="check3" class="z patch" style="left:${pct(373,W)};top:${pct(738,H)};width:${pct(48,W)}">✔</div>`);
// Zonas para abrir "Mis Logros"
pieza(`<button class="hot" style="${caja(95,545,330,55)}" aria-label="Ver mis logros" onclick="abrir()"></button>`);
BADGES.forEach(([cx,cy],i)=>{
  pieza(`<button class="hot round" style="${caja(cx-48,cy-48,96,96)}" aria-label="Ver logro ${i+1}" onclick="abrir()"></button>`);
});

/* =========================================================
   MOSTRAR TODO
   ========================================================= */
const $ = id => document.getElementById(id);
function pintar(){
  guardar();
  $('coins').textContent = S.monedas;
  $('lvl').textContent = S.nivel; $('lvl').setAttribute('font-size', S.nivel > 99 ? 28 : S.nivel > 9 ? 38 : 46);
  $('xpTxt').textContent = `${S.xp} / ${xpMax()} XP`;
  $('xpFill').style.width = Math.min(100, S.xp / xpMax() * 100) + '%';
  $('logTxt').textContent = `${S.logros.length} / ${LOGROS.length}`;
  $('logFill').style.width = (S.logros.length / LOGROS.length * 100) + '%';
  $('check3').style.display = S.logros.includes('l3') ? 'flex' : 'none';

  // Corral
  const lista = $('lista');
  const mios = ANIMALES.filter(a => (S.inv[a.id]||0) > 0);
  if(!mios.length){
    lista.innerHTML = '<div class="vacio">Todavía no tienes animales. ¡Toca “Comprar” en la tienda! 🐣</div>';
  } else {
    lista.innerHTML = mios.map(a => `
      <div class="card">
        <div class="em">${a.e}</div>
        <div>${a.n}</div>
        <div class="num">× ${S.inv[a.id]}</div>
        <button class="vender" onclick="vender('${a.id}')">Vender 🪙 ${precioVenta(a)}</button>
      </div>`).join('');
  }
  // Ventana de logros
  $('modalCuenta').textContent = `(${S.logros.length}/${LOGROS.length})`;
  $('grid').innerHTML = LOGROS.map(l => `
    <div class="logro ${S.logros.includes(l.id)?'':'no'}">
      <div class="ic">${l.e}</div><div><b>${l.n}</b><small>${l.d}</small></div>
    </div>`).join('');
}

/* =========================================================
   ACCIONES
   ========================================================= */
function comprar(id){
  const a = ANIMALES.find(x=>x.id===id);
  if(S.monedas < a.p){
    const faltan = a.p - S.monedas;
    const c = $('coins'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
    sonido([200,160]); decir(`¡Uy! Te faltan ${faltan} monedas para comprar la ${a.n.toLowerCase()}.`, true);
    return;
  }
  S.monedas -= a.p;
  S.inv[id] = (S.inv[id]||0) + 1;
  S.compro[id] = true; S.comprados++;
  ganarXP(30);
  volar(a.e, a.x, a.y - 60);
  sonido([660,880]); decir(`¡Compraste ${a.n}! ${a.e}`);
  revisarLogros(); pintar();
}
function vender(id){
  const a = ANIMALES.find(x=>x.id===id);
  if(!(S.inv[id]>0)) return;
  S.inv[id]--; S.vendidos++;
  S.monedas += precioVenta(a);
  ganarXP(10);
  volar('🪙', 1490, 60);
  sonido([880,660]); decir(`¡Vendiste ${a.n} y ganaste ${precioVenta(a)} monedas! 🪙`);
  revisarLogros(); pintar();
}
function ganarXP(n){
  S.xp += n;
  while(S.xp >= xpMax()){
    S.xp -= xpMax(); S.nivel++;
    lluvia(); setTimeout(()=>decir(`¡Subiste al nivel ${S.nivel}! ⭐`), 900);
  }
}
function revisarLogros(){
  LOGROS.forEach(l=>{
    if(!S.logros.includes(l.id) && l.ok(S)){
      S.logros.push(l.id);
      S.xp += 20;
      lluvia();
      setTimeout(()=>decir(`¡Nuevo logro: ${l.n}! ${l.e}`), 700);
    }
  });
  if(S.xp >= xpMax()) ganarXP(0);
}
function reiniciar(){
  S = nuevo(); pintar(); decir('¡Empezamos de nuevo! 🌱');
}
function abrir(){ $('modal').classList.add('open'); }
function cerrar(){ $('modal').classList.remove('open'); }
document.addEventListener('keydown', e => { if(e.key==='Escape') cerrar(); });

/* =========================================================
   EFECTOS: mensaje, voz, sonido, animaciones
   ========================================================= */
let tt;
function decir(texto, mal){
  const t = $('toast');
  t.textContent = texto; t.className = 'show' + (mal ? ' mal' : '');
  clearTimeout(tt); tt = setTimeout(()=> t.className = '', 3200);
}
let ctx;
function sonido(notas){
  try{
    ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
    notas.forEach((f,i)=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.2, ctx.currentTime + i*.15);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + i*.15 + .14);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + i*.15); o.stop(ctx.currentTime + i*.15 + .15);
    });
  }catch(e){}
}
function volar(emoji, x, y){
  const s = document.createElement('span');
  s.className = 'vuela'; s.textContent = emoji;
  s.style.left = pct(x-30, W); s.style.top = pct(y, H);
  stage.appendChild(s); setTimeout(()=>s.remove(), 1200);
}
function lluvia(){
  const fig = ['⭐','🌟','✨','🎉','🪙'];
  for(let i=0;i<22;i++){
    const s = document.createElement('span');
    s.className = 'cae'; s.textContent = fig[i % fig.length];
    s.style.left = Math.random()*95 + '%'; s.style.animationDelay = Math.random()*.7 + 's';
    stage.appendChild(s); setTimeout(()=>s.remove(), 2800);
  }
}

}
